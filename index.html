<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de contenido — Ella va llegando</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1A17'/%3E%3Ctext x='33' y='45' font-family='Georgia, serif' font-style='italic' font-size='38' fill='%23C08A5A' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- Netlify Identity: gestiona el inicio de sesión del panel -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <!-- Decap CMS: el panel visual para escribir y publicar -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
