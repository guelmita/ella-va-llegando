backend:
  name: git-gateway
  branch: main

# Dónde se guardan las fotos que subas desde el panel
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "escritos"
    label: "Escritos"
    label_singular: "Escrito"
    folder: "content/escritos"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Ella va llegando"
          - "Lo que nadie ve"
          - "Volver a empezar"
          - "Para ti"
          - "Canciones para..."
          - "La vida también es esto"
          - "Historias"
      - { label: "Extracto (resumen corto)", name: "excerpt", widget: "text" }
      - { label: "Foto", name: "image", widget: "image", required: false, hint: "Aparece en la tarjeta del escrito y arriba del texto." }
      - { label: "Descripción de la foto", name: "image_caption", widget: "string", required: false }
      - { label: "Cuerpo del escrito", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas"
    files:
      - label: "Sobre"
        name: "sobre"
        file: "content/pages/sobre.md"
        fields:
          - { label: "Texto", name: "body", widget: "markdown" }
